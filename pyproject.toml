[project]
name = "asante-secure-multi-agent"
version = "0.2.0"
description = "Secure multi-agent property operations application powered by Ruhusa."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "openai-agents>=0.3,<1",
  "pydantic>=2.11,<3",
  "ruhusa[fastapi]==0.8.0",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asante_secure_multi_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
